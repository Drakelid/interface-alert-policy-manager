name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/phpunit --testsuite unit

  librenms-integration:
    name: LibreNMS 26.7.0 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: librenms_test
          MARIADB_USER: librenms
          MARIADB_PASSWORD: librenms
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, gd, gmp, mbstring, mysqli, pdo_mysql, snmp, xml, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare supported LibreNMS baseline
        run: |
          git clone --depth 1 --branch 26.7.0 https://github.com/librenms/librenms.git "$RUNNER_TEMP/librenms-source"
          docker pull librenms/librenms:26.7.0
      - name: Integration and migration round-trip tests
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/package" \
            --volume "$RUNNER_TEMP/librenms-source/tests:/opt/librenms/tests:ro" \
            --env LIBRENMS_ROOT=/opt/librenms \
            --env DB_TEST_HOST=127.0.0.1 \
            --env DB_TEST_DATABASE=librenms_test \
            --env DB_TEST_USERNAME=librenms \
            --env DB_TEST_PASSWORD=librenms \
            --workdir /package \
            --entrypoint php \
            librenms/librenms:26.7.0 \
            -d memory_limit=1G \
            /package/tools/phpunit-librenms.php \
            -c /package/phpunit.xml \
            --testsuite integration
