name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/phpunit --testsuite unit

  librenms-integration:
    name: LibreNMS 26.7.0 integration (PHP 8.3)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: librenms_test
          MARIADB_USER: librenms
          MARIADB_PASSWORD: librenms
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, gd, gmp, mbstring, mysqli, pdo_mysql, snmp, xml, zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install supported LibreNMS baseline
        run: |
          librenms_user="$(id -un)"
          echo "LIBRENMS_USER=$librenms_user" >> "$GITHUB_ENV"
          export LIBRENMS_USER="$librenms_user"
          git clone --depth 1 --branch 26.7.0 https://github.com/librenms/librenms.git "$RUNNER_TEMP/librenms"
          composer install --working-dir="$RUNNER_TEMP/librenms" --no-interaction --prefer-dist
      - name: Integration and migration round-trip tests
        env:
          LIBRENMS_ROOT: ${{ runner.temp }}/librenms
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_DATABASE: librenms_test
          DB_TEST_USERNAME: librenms
          DB_TEST_PASSWORD: librenms
        run: 'php "$GITHUB_WORKSPACE/tools/phpunit-librenms.php" -c "$GITHUB_WORKSPACE/phpunit.xml" --testsuite integration'
